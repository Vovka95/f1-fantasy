services:
    f1_fantasy_web_client:
        container_name: f1_fantasy_web_client
        build:
            context: ../
            dockerfile: ./infrastructure/docker/webClient.Dockerfile
            target: development
        env_file:
            - .env
        ports:
            - '${FRONTEND_PORT}:${FRONTEND_PORT}'
        environment:
            VITE_API_URL: http://localhost:${PORT}
        working_dir: /app
        volumes:
            - ../webClient:/app/webClient
        depends_on:
            - f1_fantasy_web_api

    f1_fantasy_web_api:
        container_name: f1_fantasy_web_api
        build:
            context: ../
            dockerfile: ./infrastructure/docker/webApi.Dockerfile
            target: development
        env_file:
            - .env
        ports:
            - '${PORT}:${PORT}'
        working_dir: /app
        volumes:
            - ../webApi:/app/webApi
        depends_on:
            database:
                condition: service_healthy

    database:
        image: postgres:16
        container_name: f1_fantasy_db
        restart: always
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${DATABASE_NAME}
            POSTGRES_USER: ${DATABASE_USERNAME}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - '${DATABASE_PORT}:5432'
        volumes:
            - db_data:/var/lib/postgresql/data

    pgadmin:
        image: dpage/pgadmin4
        container_name: f1_fantasy_pgadmin
        restart: always
        env_file:
            - .env
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
            PGADMIN_CONFIG_SERVER_MODE: 'False'
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
        ports:
            - '${PGADMIN_PORT}:80'
        volumes:
            - pgadmin_data:/var/lib/pgadmin
            - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
            - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
        depends_on:
            - database

volumes:
    db_data:
    pgadmin_data:
